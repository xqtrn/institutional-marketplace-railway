<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Institutional Marketplace</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Institutional Marketplace</h1>
                <p>Sign in with Telegram to access admin features</p>
            </div>

            <div class="telegram-login-wrapper" id="telegramLoginWrapper">
                <div class="login-loading">Loading...</div>
            </div>

            <div id="loginStatus" class="login-status"></div>

            <div class="login-footer">
                <a href="/">Back to Marketplace</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Check if already logged in
            const session = getSession();
            if (session) {
                const redirect = new URLSearchParams(window.location.search).get('redirect') || '/admin.html';
                window.location.href = redirect;
                return;
            }

            // Fetch bot username and render widget
            try {
                const resp = await fetch('/api/auth/config');
                const config = await resp.json();

                if (!config.botUsername) {
                    throw new Error('Bot not configured');
                }

                const wrapper = document.getElementById('telegramLoginWrapper');
                wrapper.innerHTML = '';

                const script = document.createElement('script');
                script.async = true;
                script.src = 'https://telegram.org/js/telegram-widget.js?22';
                script.setAttribute('data-telegram-login', config.botUsername);
                script.setAttribute('data-size', 'large');
                script.setAttribute('data-radius', '8');
                script.setAttribute('data-onauth', 'onTelegramAuth(user)');
                script.setAttribute('data-request-access', 'write');
                wrapper.appendChild(script);
            } catch (e) {
                const wrapper = document.getElementById('telegramLoginWrapper');
                wrapper.innerHTML = '<div class="login-status error">Failed to load Telegram login</div>';
            }
        });
    </script>
</body>
</html>
